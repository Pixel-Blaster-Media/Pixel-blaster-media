name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  marketing-proxy:
    name: Marketing proxy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            booking/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install locked Next normalization oracle
        run: npm --prefix booking ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Test signed proxy against locked Next Edge adapter
        run: npm test

  application:
    name: Application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_APP_URL: https://ci.example.invalid
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54329
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      CRON_SECRET: ci-cron-secret
      AUTH_RECOVERY_SECRET: ci-recovery-secret
      BOOKING_MANAGE_SECRET: ci-booking-manage-secret
      BOOKING_PROXY_SHARED_SECRET: ci-only-proxy-attestation-secret-0123456789abcdef
      VERCEL_PROJECT_PRODUCTION_URL: pixel-blaster-media.vercel.app
    defaults:
      run:
        working-directory: booking
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Presentation boundary tests compare against the reviewed baseline.
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            booking/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install marketing proxy dependencies
        run: npm --prefix .. ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Test invoice and delivery outcomes
        run: npm run test:invoice
      - name: Test private shoot-notes interactions
        run: npm run test:private-notes-ui
      - name: Test calendar accessibility interactions
        run: node --import tsx --test tests/calendar-picker.behavior.mjs
      - name: Build production-shaped artifact with placeholders
        env:
          VERCEL_ENV: production
        run: npm run build
      - name: Probe request-scoped authenticated rendering
        run: npm run test:http-auth-dedup
      - name: Probe built security boundaries
        run: npm run test:http-security
      - name: Probe marketing signer through built self-hosted Next
        env:
          VERCEL_ENV: production
        run: node --experimental-strip-types ../tests/marketing-next-start-http.mjs

  postgresql:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_BIN: /usr/lib/postgresql/17/bin
    defaults:
      run:
        working-directory: booking
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Presentation boundary tests compare against the reviewed baseline.
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: booking/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install PostgreSQL 17 tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Execute complete clean Supabase-compatible bootstrap
        run: |
          bash scripts/generate-supabase-setup.sh
          git diff --exit-code -- supabase/setup.sql
          node --test tests/postgres/clean-bootstrap.test.mjs
          node --test tests/postgres/audit-runner-fail-closed.test.mjs
      - name: Run disposable PostgreSQL behavior suites
        run: |
          bash scripts/verify-atomic-booking-postgres.sh
          bash scripts/verify-integration-credentials-postgres.sh
          bash scripts/verify-private-booking-notes-postgres.sh
          bash scripts/verify-catalog-item-examples-postgres.sh
          LC_ALL=C TMPDIR=/tmp bash scripts/verify-canonical-media-postgres.sh
          bash scripts/verify-public-inbox-postgres.sh
          python3 scripts/verify-tenant-listing-search-postgres.py
          node scripts/verify-legacy-media-cas.mjs
          python3 scripts/verify-admin-lifecycle-postgres.py
          python3 scripts/verify-lifecycle-recovery-postgres.py
          bash lib/integrations/quickbooks/tests/verify-postgres.sh

  photo-finals:
    name: Photo finals PostgreSQL, browser and resource gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      POSTGRES_BIN: /usr/lib/postgresql/17/bin
    defaults:
      run:
        working-directory: booking
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: booking/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install PostgreSQL 17 tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-17
          echo "$POSTGRES_BIN" >> "$GITHUB_PATH"
          "$POSTGRES_BIN/postgres" --version
      - name: Install checksum-pinned PostgREST 16.3
        run: |
          mkdir -p "$RUNNER_TEMP/photo-finals-tools" "$RUNNER_TEMP/photo-finals-evidence"
          archive="$RUNNER_TEMP/photo-finals-tools/postgrest.tar.xz"
          curl --fail --silent --show-error --location \
            https://github.com/PostgREST/postgrest/releases/download/v16.3/postgrest-v16.3-linux-static-x86-64.tar.xz \
            --output "$archive"
          printf '%s  %s\n' 4eb414eb948c8800863cc8c9896a17b611b2dccf9ff581f4d57f42ec9ccee40d "$archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP/photo-finals-tools" postgrest
          echo "$RUNNER_TEMP/photo-finals-tools" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/photo-finals-tools/postgrest" --version
      - name: Install pinned Playwright and its matching Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/photo-finals-browser" --no-save --package-lock=false --ignore-scripts playwright@1.63.0
          "$RUNNER_TEMP/photo-finals-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PF_PLAYWRIGHT_MODULE=$RUNNER_TEMP/photo-finals-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          echo "PF_CHROME_PATH=$(node -e 'console.log(require(process.argv[1]).chromium.executablePath())' "$RUNNER_TEMP/photo-finals-browser/node_modules/playwright")" >> "$GITHUB_ENV"
      # Each runner owns a disposable Unix-socket PG cluster. PostgREST and the
      # browser fixture choose ephemeral loopback ports: do not start services.
      # Run serially to bound memory/disk and preserve the 125s long-I/O proof.
      # Explicit bash keeps pipefail, so tee cannot turn a runner failure green.
      - name: Finals concurrency
        run: npm run test:postgres:photo-finals | tee "$RUNNER_TEMP/photo-finals-evidence/concurrency.log"
      - name: Finals ingest
        run: npm run test:postgres:finals-ingest | tee "$RUNNER_TEMP/photo-finals-evidence/ingest.log"
      - name: Finals packages
        run: npm run test:postgres:finals-packages | tee "$RUNNER_TEMP/photo-finals-evidence/packages.log"
      - name: Finals HTTP and browser
        env:
          PF_EVIDENCE_DIR: ${{ runner.temp }}/photo-finals-evidence/browser-http
        run: npm run test:postgres:finals-http | tee "$RUNNER_TEMP/photo-finals-evidence/http.log"
      - name: Finals real PostgREST and browser
        env:
          PF_EVIDENCE_DIR: ${{ runner.temp }}/photo-finals-evidence/browser-postgrest
        run: npm run test:postgres:finals-postgrest | tee "$RUNNER_TEMP/photo-finals-evidence/postgrest.log"
      - name: Finals maximum synthetic resource fixture
        run: npm run test:postgres:finals-resource | tee "$RUNNER_TEMP/photo-finals-evidence/resource.log"
      - name: Finals long I/O
        run: npm run test:postgres:finals-long-io | tee "$RUNNER_TEMP/photo-finals-evidence/long-io.log"
      - name: Finals operator built after, PostgreSQL tail and React
        env:
          PF_AFTER_LOG: ${{ runner.temp }}/photo-finals-evidence/operator-after-build.log
        run: npm run test:photo-finals:operator | tee "$RUNNER_TEMP/photo-finals-evidence/operator.log"
      - name: Retain finals runner and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-finals-evidence
          path: ${{ runner.temp }}/photo-finals-evidence
          retention-days: 14
          if-no-files-found: warn
